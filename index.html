<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crônicas de Westeros</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--pn:rgba(14,18,27,.88);--fg:#ebe7dc;--mu:#9aa3b2;--ac:#e2b04a;--ice:#8fd0f0;--rd:#c8433a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0;height:100%;background:#0b0e14;color:var(--fg);font:14px system-ui,sans-serif;overflow:hidden}
canvas#g{display:block;width:100%;height:100%;image-rendering:pixelated;cursor:crosshair}
.p{position:absolute;background:var(--pn);border:1px solid #ffffff20;border-radius:10px;padding:9px 11px}
h3,h1{font-family:Cinzel,Georgia,serif;margin:0 0 6px;letter-spacing:.5px}
.b{height:8px;background:#0007;border-radius:4px;margin:5px 0;overflow:hidden}.b i{display:block;height:100%}
#hud{left:10px;top:calc(10px + env(safe-area-inset-top,0px));width:210px}
#log{left:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));width:min(430px,62vw);font-size:12px;line-height:1.5;background:#0c1018b0}
#mm{right:10px;top:calc(10px + env(safe-area-inset-top,0px));padding:4px;line-height:0}
#mm canvas{width:122px;height:122px;image-rendering:pixelated;border-radius:6px;cursor:pointer}
#wmap{display:none;position:absolute;inset:0;background:#060810ee;z-index:4;flex-direction:column;align-items:center;justify-content:center;gap:10px;cursor:pointer}
#wmap canvas{image-rendering:pixelated;border:1px solid #ffffff25;border-radius:8px;max-width:92vw;max-height:78vh}
#wmap .m{color:var(--mu);font-size:13px}
#md{display:none;left:50%;top:50%;transform:translate(-50%,-50%);width:min(440px,92vw);max-height:80vh;overflow:auto}
.r{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:5px 0;border-bottom:1px solid #ffffff12}
.m{color:var(--mu);font-size:12px;margin:4px 0}
button,select,input{font:inherit;border-radius:7px;border:1px solid #ffffff30;background:#1b2231;color:var(--fg);padding:6px 11px}
button{cursor:pointer;background:#2a3550}button:hover:not(:disabled){background:#3a4a72}button:disabled{opacity:.45;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac)}
#lgn{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,#1c2a3f,#080a10);z-index:5}
#lgn .c{width:min(360px,90vw);display:grid;gap:9px}
#lgn h1{font-size:28px;text-align:center;color:var(--ac)}#lgn .s{text-align:center;color:var(--ice);font-size:13px;margin-bottom:6px}
#err{color:#ff8a80;min-height:18px;font-size:12px}
.k{display:inline-block;padding:0 5px;border:1px solid #ffffff40;border-radius:4px;font-size:11px}
</style></head><body>
<canvas id="g"></canvas>
<div id="hud" class="p"><h3 id="nm"></h3><div id="st" class="m"></div><div class="b"><i id="hb" style="background:#d9463c"></i></div><div class="b"><i id="xb" style="background:#5fa8e0"></i></div><div id="gd"></div><button id="out" style="margin-top:6px;padding:3px 9px;font-size:12px">Sair e salvar</button></div>
<div id="mm" class="p"><canvas id="mmc" width="61" height="61"></canvas></div>
<div id="log" class="p"></div>
<div id="md" class="p"></div>
<div id="wmap"><canvas id="wmc"></canvas><div class="m">Você é o ponto branco · cidades em dourado · clique para fechar</div></div>
<div id="lgn"><div class="c">
<h1>Crônicas de Westeros</h1><div class="s">Uma aventura solo entre a Muralha e o Rochedo</div>
<input id="u" placeholder="Nome de usuário" maxlength="16" autocomplete="username">
<input id="pw" type="password" placeholder="Senha" autocomplete="current-password">
<select id="hs"><option value="S">Casa Stark — +20 de vida</option><option value="L">Casa Lannister — +200 de ouro</option><option value="T">Casa Targaryen — +2 de ataque</option><option value="B">Casa Baratheon — +1 de defesa</option></select>
<div style="display:flex;gap:8px"><button id="bi" style="flex:1">Entrar</button><button id="br" style="flex:1">Criar conta</button></div>
<div id="err"></div>
<div class="m">A casa só vale para contas novas. Contas e progresso ficam salvos neste navegador, com save automático.</div>
</div></div>
<script>
const $=i=>document.getElementById(i),cv=$('g'),cx=cv.getContext('2d'),T=32;
const H=(x,y,s=0)=>{let h=Math.imul(x|0,374761393)^Math.imul(y|0,668265263)^Math.imul(s|0,1442695041);h=Math.imul(h^h>>>13,1274126177);h^=h>>>16;return(h>>>0)/4294967296};
const sm=t=>t*t*(3-2*t);
const VN=(x,y,s)=>{const i=Math.floor(x),j=Math.floor(y),u=sm(x-i),v=sm(y-j),a=H(i,j,s),b=H(i+1,j,s),c=H(i,j+1,s),d=H(i+1,j+1,s);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v};
/* ===== mundo ===== */
const TW=[{n:'Castelo Negro',x:0,y:-52},{n:'Winterfell',x:0,y:-25},{n:'Correrrio',x:-10,y:12},{n:'Porto Real',x:28,y:40},{n:'Rochedo Casterly',x:-30,y:62}].map((t,i)=>({...t,i}));
const inTown=(x,y,m=0)=>TW.find(t=>Math.abs(x-t.x)<=8+m&&Math.abs(y-t.y)<=7+m);
function road(x,y){if((x==0||x==1)&&y<=-52&&y>=-70)return 1;for(let i=0;i<TW.length-1;i++){const a=TW[i],b=TW[i+1];if(y-a.y>=0&&y-a.y<=1&&x>=Math.min(a.x,b.x)&&x<=Math.max(a.x,b.x)+1)return 1;if(x-b.x>=0&&x-b.x<=1&&y>=Math.min(a.y,b.y)&&y<=Math.max(a.y,b.y)+1)return 1}return 0}
function gen(x,y){const t=inTown(x,y);if(t){const dx=x-t.x,dy=y-t.y;return((dx>=-6&&dx<=-4||dx>=4&&dx<=6)&&(dy>=-5&&dy<=-3||dy>=3&&dy<=5))?9:8}
 if(road(x,y))return 6;if(y==-60||y==-61)return 7;
 const n=VN(x/16,y/16,1)*.7+VN(x/6,y/6,2)*.3;if(n<.3)return 0;if(n<.34)return 1;if(n>.74)return 5;
 if(y<-61)return H(x,y,9)>.86?10:4;
 if(VN(x/4,y/4,3)>.64&&H(x,y,4)>.35)return y<-15?10:3;return 2}
const kk=(x,y)=>(x+5e4)*1e5+y+5e4,tc=new Map(),cut=new Set(),SOL=new Set([0,3,5,7,9,10]);
function tile(x,y){const k=kk(x,y);let v=tc.get(k);if(v===undefined){v=gen(x,y);tc.set(k,v);if(tc.size>9e4)tc.clear()}return cut.has(k)&&(v==3||v==10)?(v==10?4:2):v}
const NP=[];TW.forEach(t=>{NP.push({n:'Ferreiro de '+t.n,k:'f',ti:t.i,x:t.x-2,y:t.y},{n:'Mercador de '+t.n,k:'m',ti:t.i,x:t.x+2,y:t.y},{n:'Estalajadeiro de '+t.n,k:'e',ti:t.i,x:t.x,y:t.y-2})});
NP.forEach(n=>{n.dx=n.x;n.dy=n.y});
/* ===== dados ===== */
const W=[{n:'Punhos',a:0},{n:'Adaga',a:2,c:60},{n:'Espada Longa',a:5,c:180},{n:'Espada de Aço',a:9,c:500},{n:'Aço Valiriano',a:16,c:2500}];
const A=[{n:'Roupas',d:0},{n:'Gibão de Couro',d:1,c:70},{n:'Cota de Malha',d:3,c:220},{n:'Armadura de Placas',d:6,c:650},{n:'Armadura Valiriana',d:10,c:2800}];
const LT={'Pele de Lobo':8,'Adaga Enferrujada':15,'Coração Gelado':45,'Vidro de Dragão':220,'Escama de Dragão':160,'Madeira':5};
const MT={lobo:{n:'Lobo Gigante',hp:30,d:4,xp:22,g:[2,8],l:'Pele de Lobo',sp:.5},band:{n:'Saqueador',hp:45,d:7,xp:35,g:[10,35],l:'Adaga Enferrujada',sp:.45},wight:{n:'Morto-Vivo',hp:70,d:10,xp:65,g:[5,20],l:'Coração Gelado',sp:.6},walker:{n:'Caminhante Branco',hp:160,d:18,xp:220,g:[40,90],l:'Vidro de Dragão',sp:.5},wyv:{n:'Dragonete',hp:230,d:24,xp:420,g:[80,180],l:'Escama de Dragão',sp:.4}};
const HC={S:'#8d9bab',L:'#b3202a',T:'#2b2b33',B:'#e0b020'};
const COL=['#2a5f8f','#d9c78a','#5f9146','#5f9146','#e8eef2','#7b7f86','#a48a5e','#9aa3b0','#b9b3a4','#8a5a3c','#dfe8ee'];
/* ===== estado ===== */
const G={t:0,bn:0,bt:''},K=new Set(),mons=[],fxs=[],logs=[];let P=null,user=null,S=null;
const mh=()=>100+(P.lvl-1)*15+(P.h=='S'?20:0),nx=()=>Math.round(60*P.lvl**1.7);
const atkV=()=>3+W[P.w].a+P.lvl*1.2+(P.h=='T'?2:0),defV=()=>A[P.a].d+(P.h=='B'?1:0);
function msg(s,c='#ebe7dc'){logs.push(`<div style="color:${c}">${s}</div>`);if(logs.length>6)logs.shift();$('log').innerHTML=logs.join('')}
const fx=(x,y,t,c)=>fxs.push({x,y,t,c,l:1});
/* ===== contas e save ===== */
const AK='got_contas_v1',ld=()=>{try{return JSON.parse(localStorage.getItem(AK))||{}}catch{return{}}},sv=o=>{try{localStorage.setItem(AK,JSON.stringify(o));return 1}catch{return 0}};
async function hs(s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('got:'+s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch{return btoa(unescape(encodeURIComponent(s)))}}
function save(){if(!P||!user)return;const a=ld();if(!a[user])return;const{x,y,hp,lvl,xp,gold,inv,w,a:ar,h,home,kills,pt}=P;a[user].s={x,y,hp,lvl,xp,gold,inv,w,a:ar,h,home,kills,pt,cut:[...cut]};sv(a)}
async function auth(reg){const u=$('u').value.trim().toLowerCase(),pw=$('pw').value,e=$('err');if(u.length<3||pw.length<4){e.textContent='Use ao menos 3 letras no nome e 4 na senha.';return}
 const a=ld(),h=await hs(pw);
 if(reg){if(a[u]){e.textContent='Esse nome já existe. Entre ou escolha outro.';return}const hh=$('hs').value;a[u]={h,s:{x:0,y:-23,hp:100,lvl:1,xp:0,gold:hh=='L'?250:50,inv:{pot:2},w:0,a:0,h:hh,home:1,kills:0,pt:0,cut:[]}};if(!sv(a)){e.textContent='Não foi possível salvar neste navegador.';return}}
 else if(!a[u]||a[u].h!=h){e.textContent='Usuário ou senha incorretos.';return}
 start(u,a[u].s)}
function start(u,s){user=u;P={...s,inv:{...s.inv}};cut.clear();(s.cut||[]).forEach(k=>cut.add(k));tc.clear();Object.assign(P,{dx:P.x,dy:P.y,mv:0,cd:0,f:[0,1],tw:-1});mons.length=0;S=null;$('md').style.display='none';$('lgn').style.display='none';$('err').textContent='';$('nm').textContent=u+' · Casa '+{S:'Stark',L:'Lannister',T:'Targaryen',B:'Baratheon'}[P.h];logs.length=0;msg('Bem-vindo. Mova-se com <span class=k>WASD</span>, ataque com <span class=k>Espaço</span>, fale com NPCs e corte árvores com <span class=k>E</span>, cure-se com <span class=k>Q</span>.','#8fd0f0');msg('Cidades são seguras. Cuidado com saqueadores nas estradas.')}
$('bi').onclick=()=>auth(0);$('br').onclick=()=>auth(1);$('pw').onkeydown=e=>{if(e.key=='Enter')auth(0)};
$('out').onclick=()=>{save();P=null;user=null;$('lgn').style.display='flex'};
setInterval(save,8000);addEventListener('beforeunload',save);document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});
/* ===== lojas ===== */
const row=(t,f,b,d)=>`<div class=r><span>${t}</span><button onclick="${f}"${d?' disabled':''}>${b}</button></div>`;
function shop(){const n=S;let h=`<h3>${n.n}</h3><div class=m>Ouro: ${P.gold}g</div>`;
 if(n.k=='m'){h+=row('Poção de Cura (+45 vida) — 25g',"buy('pot')",'Comprar')+`<div class=m>Você tem ${P.inv.pot||0}. Use com Q.</div>`;for(const k in LT)if(P.inv[k])h+=row(`${k} ×${P.inv[k]} — ${LT[k]*P.inv[k]}g`,`sell('${k}')`,'Vender tudo')}
 if(n.k=='f'){const m=Math.min(4,n.ti+1);for(let i=1;i<=m;i++)h+=row(`${W[i].n} (ataque +${W[i].a}) — ${W[i].c}g`,`eq('w',${i})`,P.w>=i?'Equipado':'Comprar',P.w>=i);for(let i=1;i<=m;i++)h+=row(`${A[i].n} (defesa +${A[i].d}) — ${A[i].c}g`,`eq('a',${i})`,P.a>=i?'Equipado':'Comprar',P.a>=i);h+=`<div class=m>Equipamentos melhores aparecem em cidades mais ao sul.</div>`}
 if(n.k=='e'){h+=row('Descansar e recuperar toda a vida — grátis','rest()','Descansar')+`<div class=m>Ao entrar numa cidade, ela vira seu ponto de retorno se você cair em combate.</div>`}
 $('md').innerHTML=h+'<div style="text-align:right;margin-top:8px"><button onclick="closeShop()">Fechar</button></div>';$('md').style.display='block'}
function closeShop(){S=null;$('md').style.display='none';save()}
function buy(k){if(P.gold<25)return msg('Ouro insuficiente.','#ff8a80');P.gold-=25;P.inv.pot=(P.inv.pot||0)+1;shop()}
function sell(k){P.gold+=LT[k]*P.inv[k];msg(`Vendeu ${P.inv[k]}× ${k}.`,'#e2b04a');delete P.inv[k];shop();save()}
function eq(t,i){const it=(t=='w'?W:A)[i];if(P.gold<it.c)return msg('Ouro insuficiente.','#ff8a80');P.gold-=it.c;P[t]=i;msg('Equipou '+it.n+'.','#e2b04a');shop();save()}
function rest(){P.hp=mh();msg('Você descansou e se sente renovado.','#9f9');save()}
/* ===== jogo ===== */
const free=(x,y)=>!SOL.has(tile(x,y))&&!NP.some(n=>n.x==x&&n.y==y)&&!mons.some(m=>m.x==x&&m.y==y);
function spawn(){for(let k=0;k<8;k++){const a=Math.random()*6.283,r=11+Math.random()*7,x=Math.round(P.x+Math.cos(a)*r),y=Math.round(P.y+Math.sin(a)*r);if(!free(x,y)||(x==P.x&&y==P.y)||inTown(x,y,4))continue;
 let t='lobo';if(tile(x,y)==6)t=Math.random()<.7?'band':'lobo';else if(y<-62)t=Math.random()<.18?'walker':'wight';else if(y>40&&Math.random()<.25)t='wyv';
 mons.push({t,x,y,dx:x,dy:y,hp:MT[t].hp,mv:1,cd:1,ht:0});return}}
function atk(m){if(P.cd>0)return;P.cd=.65;const d=Math.max(1,Math.round(atkV()+Math.random()*4));m.hp-=d;m.ht=.12;fx(m.x,m.y,'-'+d,'#fff2b0');if(m.hp<=0)kill(m)}
function kill(m){mons.splice(mons.indexOf(m),1);const d=MT[m.t],g=d.g[0]+Math.floor(Math.random()*(d.g[1]-d.g[0]+1));P.gold+=g;P.xp+=d.xp;P.kills++;let s=`${d.n} derrotado: +${d.xp} XP, +${g}g`;
 if(Math.random()<.6){P.inv[d.l]=(P.inv[d.l]||0)+1;s+=', '+d.l}if(Math.random()<.12){P.inv.pot=(P.inv.pot||0)+1;s+=', Poção de Cura'}msg(s,'#9f9');
 while(P.xp>=nx()){P.xp-=nx();P.lvl++;P.hp=mh();msg('Você alcançou o nível '+P.lvl+'!','#ffd24a');fx(P.x,P.y,'NÍVEL!','#ffd24a');save()}}
function die(){P.gold=Math.floor(P.gold*.8);const t=TW[P.home];P.x=t.x;P.y=t.y+2;P.dx=P.x;P.dy=P.y;P.hp=mh();mons.length=0;msg('Você caiu em combate e perdeu 20% do ouro. Acordou em '+t.n+'.','#ff8a80');save()}
function talk(){const n=NP.find(n=>Math.max(Math.abs(n.x-P.x),Math.abs(n.y-P.y))<=1);if(n){S=n;shop();return 1}return 0}
function chop(){const x=P.x+P.f[0],y=P.y+P.f[1],t=tile(x,y);if(t==3||t==10){cut.add(kk(x,y));P.inv['Madeira']=(P.inv['Madeira']||0)+1;msg('Você cortou uma árvore. +1 Madeira','#c9a')}else msg('Nada para fazer aqui.','#9aa3b2')}
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(e.target.tagName=='INPUT'||e.target.tagName=='SELECT')return;if(!P)return;
 if(['arrowup','arrowdown','arrowleft','arrowright',' ','w','a','s','d','e','q'].includes(k))e.preventDefault();
 if(k=='escape'&&S)return closeShop();if(S)return;K.add(k);
 if(k=='e'&&!e.repeat&&!talk())chop();
 if(k=='q'&&!e.repeat){if(P.inv.pot>0&&P.hp<mh()){P.inv.pot--;P.hp=Math.min(mh(),P.hp+45);fx(P.x,P.y,'+45','#7f7')}else msg('Sem poções ou vida cheia.','#9aa3b2')}});
addEventListener('keyup',e=>K.delete(e.key.toLowerCase()));addEventListener('blur',()=>K.clear());
cv.addEventListener('pointerdown',e=>{if(!P||S)return;const s=sc(),x=Math.round(P.dx+(e.clientX-cv.width/2)/s),y=Math.round(P.dy+(e.clientY-cv.height/2)/s);
 const n=NP.find(n=>n.x==x&&n.y==y);if(n){if(!talk())msg('Aproxime-se de '+n.n+'.','#9aa3b2');return}
 const m=mons.find(m=>m.x==x&&m.y==y);if(m){if(Math.max(Math.abs(m.x-P.x),Math.abs(m.y-P.y))<=1)atk(m);else msg('Alvo distante demais.','#9aa3b2');return}
 const dx=x-P.x,dy=y-P.y;if(Math.abs(dx)+Math.abs(dy)==1){P.f=[dx,dy];chop()}});
const sc=()=>(cv.width<700?1.4:2)*T;
function upd(dt){G.t+=dt;P.mv-=dt;P.cd-=dt;const sf=inTown(P.x,P.y);
 P.dx+=(P.x-P.dx)*Math.min(1,dt*16);P.dy+=(P.y-P.dy)*Math.min(1,dt*16);
 if(P.mv<=0){let a=(K.has('d')||K.has('arrowright'))-(K.has('a')||K.has('arrowleft')),b=(K.has('s')||K.has('arrowdown'))-(K.has('w')||K.has('arrowup'));if(a)b=0;
  if(a||b){P.f=[a,b];const x=P.x+a,y=P.y+b;if(free(x,y)){P.x=x;P.y=y;P.mv=.15}}}
 if(K.has(' ')){const m=mons.filter(m=>Math.max(Math.abs(m.x-P.x),Math.abs(m.y-P.y))<=1).sort((a,b)=>a.hp-b.hp)[0];if(m)atk(m)}
 const t=inTown(P.x,P.y);if(t&&t.i!=P.tw){P.tw=t.i;P.home=t.i;G.bn=3;G.bt=t.n}if(!t)P.tw=-1;
 P.hp=Math.min(mh(),P.hp+dt*(t?6:.6));
 G.sp=(G.sp||0)-dt;if(G.sp<=0){G.sp=1.2;if(mons.length<16)spawn()}
 for(let i=mons.length-1;i>=0;i--){const m=mons[i],d=MT[m.t];if(Math.max(Math.abs(m.x-P.x),Math.abs(m.y-P.y))>40){mons.splice(i,1);continue}
  m.mv-=dt;m.cd-=dt;const ex=P.x-m.x,ey=P.y-m.y,dist=Math.max(Math.abs(ex),Math.abs(ey));
  if(dist<=1){if(m.cd<=0&&!t){m.cd=1.2;const h=Math.max(1,Math.round(d.d*(.7+Math.random()*.6))-defV());P.hp-=h;fx(P.x,P.y,'-'+h,'#ff6b5f');if(P.hp<=0){die();return}}}
  else if(m.mv<=0){m.mv=d.sp;let sx=0,sy=0;if(dist<8){if(Math.abs(ex)>=Math.abs(ey))sx=Math.sign(ex);else sy=Math.sign(ey)}else if(Math.random()<.4){const r=Math.random()*4|0;sx=[1,-1,0,0][r];sy=[0,0,1,-1][r]}
   const ok=(a,b)=>(a||b)&&free(m.x+a,m.y+b)&&!(m.x+a==P.x&&m.y+b==P.y)&&!inTown(m.x+a,m.y+b);
   if(ok(sx,sy)){m.x+=sx;m.y+=sy}else if(dist<8){const a2=sx?0:Math.sign(ex),b2=sy?0:Math.sign(ey);if(ok(a2,b2)){m.x+=a2;m.y+=b2}}}
  m.dx+=(m.x-m.dx)*Math.min(1,dt*10);m.dy+=(m.y-m.dy)*Math.min(1,dt*10);m.ht-=dt}
 for(let i=fxs.length-1;i>=0;i--){fxs[i].l-=dt;if(fxs[i].l<=0)fxs.splice(i,1)}G.bn-=dt}
/* ===== desenho ===== */
function tileDraw(x,y,X,Y,s){const t=tile(x,y),sn=y<-61;cx.fillStyle=(t==3||t==10)?(sn?COL[4]:COL[2]):COL[t];cx.fillRect(X,Y,s+1,s+1);cx.fillStyle='rgba(0,0,0,'+H(x,y,7)*.09+')';cx.fillRect(X,Y,s+1,s+1);
 const u=s/16,r=(a,b,w,h,c)=>{cx.fillStyle=c;cx.fillRect(X+a*u,Y+b*u,w*u,h*u)};
 if(t==0){if(((x*3+y+(G.t*1.5|0))&3)==0)r(3,6,8,1,'#ffffff30')}
 else if(t==2){if(H(x,y,5)>.8){r(6,7,1,3,'#3e6e2e');r(9,8,1,2,'#3e6e2e')}}
 else if(t==3){r(7,9,2,5,'#5a3a20');r(3,1,10,9,'#2f6a30');r(5,0,6,3,'#3d8240')}
 else if(t==10){r(7,11,2,4,'#4a3320');r(4,7,8,4,'#1f4d36');r(5,3,6,5,'#28603f');r(7,0,2,4,'#dfeaf0')}
 else if(t==5){r(1,4,14,11,'#6a6e76');r(5,0,6,6,'#8a8f98');r(6,0,4,2,'#eef')}
 else if(t==6){r(2,3,2,2,'#8a7148');r(9,9,3,2,'#8a7148')}
 else if(t==7){r(0,7,16,1,'#0006');r(0,0,16,2,'#c9d6e3');r(4,0,1,7,'#0004');r(11,8,1,8,'#0004')}
 else if(t==8){r(0,0,16,1,'#0002');r(0,0,1,16,'#0002')}
 else if(t==9){r(0,0,16,9,'#9c3d2e');r(0,9,16,7,'#6a4a32');r(6,9,3,7,'#2a1c12');r(2,10,3,3,'#e8c56a')}}
function spr(k,X,Y,s,c){const u=s/16,r=(a,b,w,h,q)=>{cx.fillStyle=q;cx.fillRect(X+a*u,Y+b*u,w*u,h*u)};r(3,13,10,2,'#0005');
 const hu=(bd,hd,ac,ey)=>{r(5,11,2,4,'#2a2018');r(9,11,2,4,'#2a2018');r(4,6,8,6,bd);r(5,2,6,5,hd);r(5,1,6,2,ac);if(ey){r(6,4,1,1,ey);r(9,4,1,1,ey)}};
 if(k=='p'){hu(c,'#e7c39c','#3a2a1a');r(12,4,1,8,'#e6e6ee');r(11,10,3,1,'#a08040')}
 else if(k=='f'){hu('#5a4a3a','#d2a67e','#222');r(5,8,6,4,'#8b8b90');r(12,3,3,3,'#555')}
 else if(k=='m'){hu('#3b6ea5','#e0b58c','#c9a227');r(11,7,3,4,'#8a5a2c')}
 else if(k=='e'){hu('#7a3b3b','#e0b58c','#eee');r(3,8,2,3,'#d9d9d9')}
 else if(k=='lobo'){r(2,8,10,5,'#8a8f98');r(11,6,4,4,'#a2a8b0');r(12,7,1,1,'#f33');r(3,12,2,3,'#6b7078');r(9,12,2,3,'#6b7078');r(1,8,2,2,'#6b7078')}
 else if(k=='band'){hu('#5b4632','#c8a07a','#111');r(5,4,6,2,'#222');r(12,6,1,6,'#bbb')}
 else if(k=='wight'){hu('#4c6a7c','#b8d0dc','#3a5060','#6cf')}
 else if(k=='walker'){hu('#cfe6f5','#e8f5ff','#8fd0f0','#2af');r(4,0,1,2,'#8fd0f0');r(7,0,2,2,'#8fd0f0');r(11,0,1,2,'#8fd0f0');r(12,4,1,9,'#aee')}
 else if(k=='wyv'){r(0,4,4,5,'#2c6a2c');r(12,3,4,5,'#2c6a2c');r(2,7,10,6,'#3f8a3a');r(11,5,5,4,'#4fa04a');r(14,6,1,1,'#f33');r(3,12,2,3,'#2c6a2c');r(8,12,2,3,'#2c6a2c');r(0,9,3,2,'#3f8a3a')}}
function draw(dt){const w=cv.width,h=cv.height,s=sc(),si=Math.ceil(s),ox=w/2-s/2-P.dx*s,oy=h/2-s/2-P.dy*s;
 const x0=Math.floor(P.dx-w/2/s)-1,x1=Math.ceil(P.dx+w/2/s)+1,y0=Math.floor(P.dy-h/2/s)-1,y1=Math.ceil(P.dy+h/2/s)+1;
 for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)tileDraw(x,y,Math.floor(x*s+ox),Math.floor(y*s+oy),si);
 const es=[...NP.filter(n=>n.x>=x0&&n.x<=x1&&n.y>=y0&&n.y<=y1).map(n=>({k:n.k,dx:n.x,dy:n.y,n:n.n})),...mons.map(m=>({k:m.t,dx:m.dx,dy:m.dy,m})),{k:'p',dx:P.dx,dy:P.dy,c:HC[P.h],p:1}].sort((a,b)=>a.dy-b.dy);
 cx.textAlign='center';cx.font='600 11px system-ui,sans-serif';
 for(const e of es){const X=Math.floor(e.dx*s+ox),Y=Math.floor(e.dy*s+oy);spr(e.k,X,Y,si,e.c);
  if(e.n){cx.fillStyle='#000a';cx.fillText(e.n,X+s/2+1,Y-3);cx.fillStyle='#ffe9a8';cx.fillText(e.n,X+s/2,Y-4)}
  if(e.m){const d=MT[e.m.t];cx.fillStyle='#000a';cx.fillRect(X+s*.1,Y-6,s*.8,5);cx.fillStyle=e.m.ht>0?'#fff':'#d9463c';cx.fillRect(X+s*.1+1,Y-5,(s*.8-2)*Math.max(0,e.m.hp/d.hp),3);cx.fillStyle='#fff';cx.fillText(d.n,X+s/2,Y-9)}}
 for(const f of fxs){cx.globalAlpha=Math.min(1,f.l*1.5);cx.fillStyle=f.c;cx.font='800 15px system-ui,sans-serif';cx.fillText(f.t,(f.x-P.dx)*s+w/2,(f.y-P.dy)*s+h/2-s*.4-(1-f.l)*30)}cx.globalAlpha=1;
 const dk=.5-.5*Math.cos(G.t/150*6.283);cx.fillStyle='rgba(8,12,40,'+(.5*dk*dk)+')';cx.fillRect(0,0,w,h);
 if(P.dy<-58){cx.fillStyle='#fffc';for(let i=0;i<70;i++){const x=((H(i,1)*w+G.t*14*((i%3)-1))%w+w)%w,y=((H(i,2)*h+G.t*(40+H(i,3)*40))%h+h)%h;cx.fillRect(x,y,2,2)}}
 if(G.bn>0){cx.globalAlpha=Math.min(1,G.bn);cx.font='800 30px Cinzel,Georgia,serif';cx.fillStyle='#000a';cx.fillText(G.bt,w/2+2,102);cx.fillStyle='#e2b04a';cx.fillText(G.bt,w/2,100);cx.globalAlpha=1}}
const mmc=$('mmc').getContext('2d'),MMC=['#2a5f8f','#d9c78a','#5f9146','#3f7a36','#e8eef2','#7b7f86','#a48a5e','#c9d6e3','#b9b3a4','#8a5a3c','#2e5a3a'];
function hud(){$('st').textContent=`Nível ${P.lvl} · ${Math.ceil(P.hp)}/${mh()} vida · ataque ${Math.round(atkV())} · defesa ${defV()}`;$('hb').style.width=100*P.hp/mh()+'%';$('xb').style.width=100*P.xp/nx()+'%';
 $('gd').innerHTML=`Ouro <b style="color:#e2b04a">${P.gold}</b> · Poções <b>${P.inv.pot||0}</b><div class=m>${W[P.w].n} · ${A[P.a].n}</div>`;
 for(let j=0;j<61;j++)for(let i=0;i<61;i++){mmc.fillStyle=MMC[tile(P.x-30+i,P.y-30+j)];mmc.fillRect(i,j,1,1)}
 mmc.fillStyle='#ffd24a';for(const t of TW){const i=t.x-P.x+30,j=t.y-P.y+30;if(i>=0&&i<61&&j>=0&&j<61)mmc.fillRect(i-1,j-1,3,3)}
 mmc.fillStyle='#f55';for(const m of mons){const i=m.x-P.x+30,j=m.y-P.y+30;if(i>=0&&i<61&&j>=0&&j<61)mmc.fillRect(i,j,1,1)}mmc.fillStyle='#fff';mmc.fillRect(29,29,3,3)}
/* mapa mundi */
const WX0=-45,WX1=45,WY0=-75,WY1=75,wmc=$('wmc');
wmc.width=WX1-WX0+1;wmc.height=WY1-WY0+1;
const wmctx=wmc.getContext('2d');
function worldmap(){for(let j=WY0;j<=WY1;j++)for(let i=WX0;i<=WX1;i++){wmctx.fillStyle=MMC[gen(i,j)];wmctx.fillRect(i-WX0,j-WY0,1,1)}
 wmctx.fillStyle='#ffd24a';for(const t of TW)wmctx.fillRect(t.x-WX0-1,t.y-WY0-1,3,3);
 if(P){wmctx.fillStyle='#fff';wmctx.fillRect(P.x-WX0-1,P.y-WY0-1,3,3);
  wmctx.strokeStyle='#fff';wmctx.lineWidth=1;wmctx.strokeRect(P.x-WX0-2.5,P.y-WY0-2.5,6,6)}}
$('mm').onclick=()=>{if(!P)return;worldmap();$('wmap').style.display='flex'};
$('wmap').onclick=()=>$('wmap').style.display='none';
function rs(){cv.width=innerWidth;cv.height=innerHeight;cx.imageSmoothingEnabled=false}addEventListener('resize',rs);rs();
let last=performance.now(),ht=0;
function loop(n){const dt=Math.min(.05,(n-last)/1e3);last=n;if(P){if(!S)upd(dt);if(P){draw(dt);ht-=dt;if(ht<=0){ht=.25;hud()}}}else{cx.fillStyle='#0b0e14';cx.fillRect(0,0,cv.width,cv.height)}requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script></body></html>
