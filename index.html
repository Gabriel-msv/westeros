<script>
const $=i=>document.getElementById(i),cv=$('g'),cx=cv.getContext('2d'),T=32;
const H=(x,y,s=0)=>{let h=Math.imul(x|0,374761393)^Math.imul(y|0,668265263)^Math.imul(s|0,1442695041);h=Math.imul(h^h>>>13,1274126177);h^=h>>>16;return(h>>>0)/4294967296};
const sm=t=>t*t*(3-2*t);
const VN=(x,y,s)=>{const i=Math.floor(x),j=Math.floor(y),u=sm(x-i),v=sm(y-j),a=H(i,j,s),b=H(i+1,j,s),c=H(i,j+1,s),d=H(i+1,j+1,s);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v};
/* ===== mundo ===== */
const TW=[
/* Terras da Coroa */
{n:'Porto Real',r:'Terras da Coroa',x:350,y:650,t:'city'},
{n:'Pedra do Dragão',r:'Terras da Coroa',x:700,y:650,t:'fort'},
{n:'Descendente',r:'Terras da Coroa',x:600,y:500,t:'town'},
/* O Norte */
{n:'Winterfell',r:'O Norte',x:-250,y:-350,t:'fort'},
{n:'Porto Branco',r:'O Norte',x:600,y:-50,t:'city'},
{n:'Forte do Pavor',r:'O Norte',x:300,y:-300,t:'fort'},
{n:'Fosso Cailin',r:'O Norte',x:-150,y:100,t:'fort'},
{n:'Muralha / Castle Black',r:'O Norte',x:0,y:-650,t:'wall'},

{n:'Vilavelha / Torralta',r:'A Campina',x:-600,y:1450,t:'city'},
{n:'Jardim de Cima',r:'A Campina',x:-150,y:1050,t:'fort'},
{n:'Monte Chifre',r:'A Campina',x:-550,y:1200,t:'fort'},
/* Terras do Oeste */
{n:'Rochedo Casterly',r:'Terras do Oeste',x:-800,y:850,t:'fort'},
{n:'Lannisporto',r:'Terras do Oeste',x:-650,y:1050,t:'city'},
{n:'Dente de Ouro',r:'Terras do Oeste',x:-1050,y:500,t:'fort'},
/* Vale de Arryn */
{n:'Ninho das Águias',r:'Vale de Arryn',x:850,y:250,t:'fort'},
{n:'Porta da Lua',r:'Vale de Arryn',x:750,y:450,t:'fort'},
{n:'Vila Gulltown',r:'Vale de Arryn',x:1050,y:500,t:'city'},
/* Terras Fluviais */
{n:'Correntexa',r:'Terras Fluviais',x:0,y:350,t:'fort'},
{n:'Harrenhal',r:'Terras Fluviais',x:300,y:300,t:'ruin'},
{n:'As Gêmeas',r:'Terras Fluviais',x:-350,y:250,t:'fort'},
{n:'Poço da Donzela',r:'Terras Fluviais',x:550,y:350,t:'town'},
/* Terras da Tempestade */
{n:'Ponta da Tempestade',r:'Terras da Tempestade',x:500,y:1000,t:'fort'},
{n:'Ninho do Corvo',r:'Terras da Tempestade',x:800,y:900,t:'fort'},
/* Dorne */
{n:'Lance do Sol / Cidade da Sombra',r:'Dorne',x:900,y:1900,t:'city'},
{n:'Jardins da Água',r:'Dorne',x:500,y:1650,t:'palace'},
{n:'Tombastelo',r:'Dorne',x:-50,y:1750,t:'fort'},
/* Ilhas de Ferro */
{n:'Pyke',r:'Ilhas de Ferro',x:-1200,y:600,t:'fort'},
/* Além da Muralha */
{n:'Ancoradouro Duro',r:'Além da Muralha',x:350,y:-1100,t:'ruin'}
].map((t,i)=>({...t,i}));
const inTown=(x,y,m=0)=>TW.find(t=>Math.abs(x-t.x)<=8+m&&Math.abs(y-t.y)<=7+m);
function road(x,y){if((x==0||x==1)&&y<=-52&&y>=-70)return 1;for(let i=0;i<TW.length-1;i++){const a=TW[i],b=TW[i+1];if(y-a.y>=0&&y-a.y<=1&&x>=Math.min(a.x,b.x)&&x<=Math.max(a.x,b.x)+1)return 1;if(x-b.x>=0&&x-b.x<=1&&y>=Math.min(a.y,b.y)&&y<=Math.max(a.y,b.y)+1)return 1}return 0}
function gen(x,y){const t=inTown(x,y);if(t){const dx=x-t.x,dy=y-t.y;return((dx>=-6&&dx<=-4||dx>=4&&dx<=6)&&(dy>=-5&&dy<=-3||dy>=3&&dy<=5))?9:8}
 if(road(x,y))return 6;if(y==-60||y==-61)return 7;
 const n=VN(x/16,y/16,1)*.7+VN(x/6,y/6,2)*.3;if(n<.3)return 0;if(n<.34)return 1;if(n>.74)return 5;
 if(y<-61)return H(x,y,9)>.86?10:4;
 if(VN(x/4,y/4,3)>.64&&H(x,y,4)>.35)return y<-15?10:3;return 2}
const kk=(x,y)=>(x+5e4)*1e5+y+5e4,tc=new Map(),cut=new Set(),SOL=new Set([0,3,5,7,9,10]);
function tile(x,y){const k=kk(x,y);let v=tc.get(k);if(v===undefined){v=gen(x,y);tc.set(k,v);if(tc.size>9e4)tc.clear()}return cut.has(k)&&(v==3||v==10)?(v==10&&y<-61?4:2):v}
const NP=[];TW.forEach(t=>{NP.push({n:'Ferreiro de '+t.n,k:'f',ti:t.i,x:t.x-2,y:t.y},{n:'Mercador de '+t.n,k:'m',ti:t.i,x:t.x+2,y:t.y},{n:'Estalajadeiro de '+t.n,k:'e',ti:t.i,x:t.x,y:t.y-2})});
NP.forEach(n=>{n.dx=n.x;n.dy=n.y});
/* ===== dados ===== */
const W=[{n:'Punhos',a:0},{n:'Adaga',a:2,c:60},{n:'Espada Longa',a:5,c:180},{n:'Espada de Aço',a:9,c:500},{n:'Aço Valiriano',a:16,c:2500}];
const A=[{n:'Roupas',d:0},{n:'Gibão de Couro',d:1,c:70},{n:'Cota de Malha',d:3,c:220},{n:'Armadura de Placas',d:6,c:650},{n:'Armadura Valiriana',d:10,c:2800}];
const LT={'Pele de Lobo':8,'Adaga Enferrujada':15,'Coração Gelado':45,'Vidro de Dragão':220,'Escama de Dragão':160,'Madeira':5};
const MT={lobo:{n:'Lobo Gigante',hp:30,d:4,xp:22,g:[2,8],l:'Pele de Lobo',sp:.5},band:{n:'Saqueador',hp:45,d:7,xp:35,g:[10,35],l:'Adaga Enferrujada',sp:.45},wight:{n:'Morto-Vivo',hp:70,d:10,xp:65,g:[5,20],l:'Coração Gelado',sp:.6},walker:{n:'Caminhante Branco',hp:160,d:18,xp:220,g:[40,90],l:'Vidro de Dragão',sp:.5},wyv:{n:'Dragonete',hp:230,d:24,xp:420,g:[80,180],l:'Escama de Dragão',sp:.4}};
const HC={S:'#8d9bab',L:'#b3202a',T:'#2b2b33',B:'#e0b020'};
const COL=['#2a5f8f','#d9c78a','#5f9146','#5f9146','#e8eef2','#7b7f86','#a48a5e','#9aa3b0','#b9b3a4','#8a5a3c','#dfe8ee'];
/* ===== estado ===== */
const G={t:0,bn:0,bt:''},K=new Set(),mons=[],fxs=[],logs=[];let P=null,user=null,S=null;
const mh=()=>100+(P.lvl-1)*15+(P.h=='S'?20:0),nx=()=>Math.round(60*P.lvl**1.7);
const nearestTown=()=>TW.reduce((a,t)=>{const d=Math.hypot(P.x-t.x,P.y-t.y);return !a||d<a.d?{t,d}:a},null);
const atkV=()=>3+W[P.w].a+P.lvl*1.2+(P.h=='T'?2:0),defV=()=>A[P.a].d+(P.h=='B'?1:0);
function msg(s,c='#ebe7dc'){logs.push(`<div style="color:${c}">${s}</div>`);if(logs.length>6)logs.shift();$('log').innerHTML=logs.join('')}
const fx=(x,y,t,c)=>fxs.push({x,y,t,c,l:1});
/* ===== contas e save ===== */
const AK='got_contas_v1',ld=()=>{try{return JSON.parse(localStorage.getItem(AK))||{}}catch{return{}}},sv=o=>{try{localStorage.setItem(AK,JSON.stringify(o));return 1}catch{return 0}};
async function hs(s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('got:'+s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch{return btoa(unescape(encodeURIComponent(s)))}}
function save(){if(!P||!user)return;const a=ld();if(!a[user])return;const{x,y,hp,lvl,xp,gold,inv,w,a:ar,h,home,kills,pt,horse,mounted}=P;a[user].s={x,y,hp,lvl,xp,gold,inv,w,a:ar,h,home,kills,pt,horse:!!horse,mounted:!!mounted,cut:[...cut],v:9};sv(a)}
async function auth(reg){const u=$('u').value.trim().toLowerCase(),pw=$('pw').value,e=$('err');if(u.length<3||pw.length<4){e.textContent='Use ao menos 3 letras no nome e 4 na senha.';return}
 const a=ld(),h=await hs(pw);
 if(reg){if(a[u]){e.textContent='Esse nome já existe. Entre ou escolha outro.';return}const hh=$('hs').value;const HOME={S:3,L:11,T:1,B:21},SP={S:[TW[3].x,TW[3].y+2],L:[TW[11].x,TW[11].y+2],T:[TW[1].x,TW[1].y+2],B:[TW[21].x,TW[21].y+2]};const sp=SP[hh];a[u]={h:hh,s:{x:sp[0],y:sp[1],hp:100,lvl:1,xp:0,gold:hh=='L'?250:50,inv:{pot:2},w:0,a:0,h:hh,home:HOME[hh],kills:0,pt:0,horse:false,mounted:false,cut:[],v:9}};if(!sv(a)){e.textContent='Não foi possível salvar neste navegador.';return}}
 else if(!a[u]||a[u].h!=h){e.textContent='Usuário ou senha incorretos.';return}
 start(u,a[u].s)}
function start(u,s){user=u;P={...s,inv:{...s.inv}};const HOME={S:3,L:11,T:1,B:21},SP={S:[TW[3].x,TW[3].y+2],L:[TW[11].x,TW[11].y+2],T:[TW[1].x,TW[1].y+2],B:[TW[21].x,TW[21].y+2]};const legacyCastle=Math.abs(P.x)<=3&&P.y>=-55&&P.y<=-49;if(!P.v&&legacyCastle&&HOME[P.h]!==undefined){P.home=HOME[P.h];P.x=SP[P.h][0];P.y=SP[P.h][1];P.dx=P.x;P.dy=P.y}if(u==='sudo'){P.gold=999999999;P.w=W.length-1;P.a=A.length-1;P.lvl=30;P.xp=0;P.hp=mh();P.horse=true;P.mounted=true;P.inv={pot:99,'Vidro de Dragão':99,'Escama de Dragão':99,'Pele de Lobo':99,'Madeira':99};}cut.clear();(s.cut||[]).forEach(k=>cut.add(k));tc.clear();Object.assign(P,{dx:P.x,dy:P.y,mv:0,cd:0,f:[0,1],tw:-1,horse:!!P.horse,mounted:!!P.mounted});mons.length=0;S=null;$('md').style.display='none';$('lgn').style.display='none';$('err').textContent='';$('nm').textContent=u+' · Casa '+{S:'Stark',L:'Lannister',T:'Targaryen',B:'Baratheon'}[P.h];logs.length=0;msg('Bem-vindo. Mova-se com <span class=k>WASD</span>, ataque com <span class=k>Espaço</span>, fale com NPCs e corte árvores com <span class=k>E</span>, cure-se com <span class=k>Q</span>.','#8fd0f0');msg('Cidades são seguras. Cuidado com saqueadores nas estradas.')}
$('bi').onclick=()=>auth(0);$('br').onclick=()=>auth(1);$('pw').onkeydown=e=>{if(e.key=='Enter')auth(0)};
$('out').onclick=()=>{save();P=null;user=null;$('lgn').style.display='flex'};
setInterval(save,8000);addEventListener('beforeunload',save);document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});
/* ===== lojas ===== */
const row=(t,f,b,d)=>`<div class=r><span>${t}</span><button onclick="${f}"${d?' disabled':''}>${b}</button></div>`;
function shop(){const n=S;let h=`<h3>${n.n}</h3><div class=m>Ouro: ${P.gold}g</div>`;
 if(n.k=='m'){h+=row('Poção de Cura (+45 vida) — 25g',"buy('pot')",'Comprar')+`<div class=m>Você tem ${P.inv.pot||0}. Use com Q.</div>`;for(const k in LT)if(P.inv[k])h+=row(`${k} ×${P.inv[k]} — ${LT[k]*P.inv[k]}g`,`sell('${k}')`,'Vender tudo')}
 if(n.k=='f'){const m=Math.min(4,n.ti+1);for(let i=1;i<=m;i++)h+=row(`${W[i].n} (ataque +${W[i].a}) — ${W[i].c}g`,`eq('w',${i})`,P.w>=i?'Equipado':'Comprar',P.w>=i);for(let i=1;i<=m;i++)h+=row(`${A[i].n} (defesa +${A[i].d}) — ${A[i].c}g`,`eq('a',${i})`,P.a>=i?'Equipado':'Comprar',P.a>=i);h+=`<div class=m>Equipamentos melhores aparecem em cidades mais ao sul.</div>`}
 if(n.k=='e'){h+=row('Descansar e recuperar toda a vida — grátis','rest()','Descansar')+`<div class=m>Ao entrar numa cidade, ela vira seu ponto de retorno se você cair em combate.</div>`}
 $('md').innerHTML=h+'<div style="text-align:right;margin-top:8px"><button onclick="closeShop()">Fechar</button></div>';$('md').style.display='block'}
function closeShop(){S=null;$('md').style.display='none';save()}
function buy(k){if(P.gold<25)return msg('Ouro insuficiente.','#ff8a80');P.gold-=25;P.inv.pot=(P.inv.pot||0)+1;shop()}
function sell(k){P.gold+=LT[k]*P.inv[k];msg(`Vendeu ${P.inv[k]}× ${k}.`,'#e2b04a');delete P.inv[k];shop();save()}
function eq(t,i){const it=(t=='w'?W:A)[i];if(P.gold<it.c)return msg('Ouro insuficiente.','#ff8a80');P.gold-=it.c;P[t]=i;msg('Equipou '+it.n+'.','#e2b04a');shop();save()}
function rest(){P.hp=mh();msg('Você descansou e se sente renovado.','#9f9');save()}
/* ===== jogo ===== */
const free=(x,y)=>!SOL.has(tile(x,y))&&!NP.some(n=>n.x==x&&n.y==y)&&!mons.some(m=>m.x==x&&m.y==y);
function spawn(){for(let k=0;k<8;k++){const a=Math.random()*6.283,r=11+Math.random()*7,x=Math.round(P.x+Math.cos(a)*r),y=Math.round(P.y+Math.sin(a)*r);if(!free(x,y)||(x==P.x&&y==P.y)||inTown(x,y,4))continue;
 let t='lobo';if(tile(x,y)==6)t=Math.random()<.7?'band':'lobo';else if(y<-62)t=Math.random()<.18?'walker':'wight';else if(y>40&&Math.random()<.25)t='wyv';
 mons.push({t,x,y,dx:x,dy:y,hp:MT[t].hp,mv:1,cd:1,ht:0});return}}
function atk(m){if(P.cd>0)return;P.cd=.65;const d=Math.max(1,Math.round(atkV()+Math.random()*4));m.hp-=d;m.ht=.12;fx(m.x,m.y,'-'+d,'#fff2b0');if(m.hp<=0)kill(m)}
function kill(m){mons.splice(mons.indexOf(m),1);const d=MT[m.t],g=d.g[0]+Math.floor(Math.random()*(d.g[1]-d.g[0]+1));P.gold+=g;P.xp+=d.xp;P.kills++;let s=`${d.n} derrotado: +${d.xp} XP, +${g}g`;
 if(Math.random()<.6){P.inv[d.l]=(P.inv[d.l]||0)+1;s+=', '+d.l}if(Math.random()<.12){P.inv.pot=(P.inv.pot||0)+1;s+=', Poção de Cura'}msg(s,'#9f9');
 while(P.xp>=nx()){P.xp-=nx();P.lvl++;P.hp=mh();msg('Você alcançou o nível '+P.lvl+'!','#ffd24a');fx(P.x,P.y,'NÍVEL!','#ffd24a');save()}}
function die(){P.gold=Math.floor(P.gold*.8);const t=TW[P.home];P.x=t.x;P.y=t.y+2;P.dx=P.x;P.dy=P.y;P.hp=mh();mons.length=0;msg('Você caiu em combate e perdeu 20% do ouro. Acordou em '+t.n+'.','#ff8a80');save()}
function talk(){const n=NP.find(n=>Math.max(Math.abs(n.x-P.x),Math.abs(n.y-P.y))<=1);if(n){S=n;shop();return 1}return 0}
function chop(){const x=P.x+P.f[0],y=P.y+P.f[1],t=tile(x,y);if(t==3||t==10){cut.add(kk(x,y));P.inv['Madeira']=(P.inv['Madeira']||0)+1;msg('Você cortou uma árvore. +1 Madeira','#c9a')}else msg('Nada para fazer aqui.','#9aa3b2')}
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(e.target.tagName=='INPUT'||e.target.tagName=='SELECT')return;if(!P)return;

 if(k=='escape'&&S)return closeShop();if(S)return;if(k=='c'&&!e.repeat){if(!P.horse)return msg('Você não possui um cavalo.','#9aa3b2');P.mounted=!P.mounted;msg(P.mounted?'Você montou a cavalo.':'Você desmontou.','#e2b04a');save();return;}K.add(k);
