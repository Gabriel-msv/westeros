<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Crônicas de Westeros</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090b0f;color:#eee7d8;font:14px system-ui,-apple-system,Segoe UI,sans-serif}
canvas{display:block;image-rendering:pixelated}
.panel{position:absolute;background:rgba(15,17,20,.94);border:1px solid rgba(230,210,160,.28);box-shadow:0 8px 30px #0009;border-radius:7px}
#hud{left:12px;top:12px;width:255px;padding:11px;z-index:5}
#mini{position:absolute;right:12px;top:12px;width:150px;height:150px;border:2px solid #5b4d35;border-radius:5px;image-rendering:pixelated;z-index:5;background:#101820}
#log{left:12px;bottom:12px;width:min(470px,62vw);min-height:38px;padding:8px 10px;z-index:5;font-size:12px}
#panel{display:none;left:50%;top:50%;transform:translate(-50%,-50%);width:min(650px,92vw);max-height:82vh;overflow:auto;padding:14px;z-index:20}
#login{position:absolute;inset:0;background:radial-gradient(circle at 50% 35%,#29343b 0,#10151a 45%,#07090c 100%);display:flex;align-items:center;justify-content:center;z-index:50}
.loginbox{width:min(430px,92vw);padding:25px;text-align:center;background:#101419ed;border:1px solid #a98b55;border-radius:9px;box-shadow:0 20px 70px #000}
.loginbox h1{font:32px Georgia,serif;color:#d9bd79;margin:0 0 4px}.loginbox p{color:#a8a49a;margin:4px 0 18px}
input,select{width:100%;padding:10px;margin:5px 0;background:#090c10;color:#eee;border:1px solid #4b4a45;border-radius:5px}
button{font:inherit;color:#eee;background:#252a2f;border:1px solid #766448;border-radius:5px;padding:6px 10px;margin:3px;cursor:pointer}
button:hover{background:#3b3b36;border-color:#b39458}button.gold{color:#f2cf75}button.danger{color:#ff9a8c}.muted{color:#98958d;font-size:12px}.bar{height:8px;background:#050608;border:1px solid #302d29;border-radius:4px;overflow:hidden;margin:5px 0}.bar i{display:block;height:100%}.row{display:flex;gap:8px;align-items:center;justify-content:space-between}.item{padding:6px 4px;border-bottom:1px solid #ffffff0d}.tag{color:#9caa9e;font-size:11px}.gold{color:#e7c76e}.title{font:18px Georgia,serif;color:#e1c27b;margin-bottom:8px}.hint{position:fixed;right:12px;bottom:12px;color:#77746d;font-size:11px;z-index:4}
</style>
</head>
<body>
<canvas id="game"></canvas>
<canvas id="mini"></canvas>
<div id="hud" class="panel"></div>
<div id="log" class="panel"></div>
<div id="panel" class="panel"></div>
<div class="hint">WASD mover · Espaço atacar · E interagir · I inventário · M mapa · C cavalo · B acampamento · X exportar</div>
<div id="login">
  <div class="loginbox">
    <h1>Crônicas de Westeros</h1>
    <p>Uma aventura solo entre a Muralha e Lançassolar</p>
    <input id="user" maxlength="18" placeholder="Nome do personagem">
    <input id="pass" type="password" maxlength="32" placeholder="Senha">
    <select id="house"><option>Stark</option><option>Lannister</option><option>Targaryen</option><option>Baratheon</option></select>
    <div><button id="enter" class="gold">Entrar</button><button id="create">Criar conta</button></div>
    <div id="loginmsg" class="muted"></div>
    <div class="muted" style="margin-top:12px">Tudo fica salvo neste navegador.</div>
  </div>
</div>
<script src="js/data.js"></script>
<script src="js/content.js"></script>
<script src="js/game.js"></script>
</body>
</html>
